name: Flaky Gate (flaky-hunter)

# 硬拦截档演示（第二版）：与 PR #2（demo-bad-pattern，报告档绿）注入的是
# 同一段坏模式代码，唯一差别 = 门禁加 --strict —— 检出 flaky → exit 1，
# 本 job 变红，合并被拦。双档对照：报告档 = 贴告示（shadow 观察误报率），
# 硬拦截档 = 拦下。判定报告与工件在 job 失败时照常上传（if: always()）。
on:
  pull_request:
  workflow_dispatch:

jobs:
  flaky-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flaky-hunter from GitHub
        run: pip install git+https://github.com/vito233/flaky-hunter.git

      - name: Run flaky gate (strict mode)
        run: |
          python -m flaky_hunter.gate \
            --src . --deps ./.fh-deps --testdir tests \
            --count 20 --per-test-timeout 30 \
            --image docker.io/library/python:3.10-slim \
            --pip-mirror https://pypi.org/simple \
            --no-volumes --strict \
            --json-out flaky-gate.json --md-out flaky-gate.md

      - name: Append verdict to job summary
        if: always()
        run: cat flaky-gate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-gate-report
          path: |
            flaky-gate.json
            flaky-gate.md
